<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Trade Machine | PRO Trading Terminal</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000000'/%3E%3Ccircle cx='50' cy='40' r='18' fill='%2300ff88'/%3E%3Crect x='35' y='55' width='30' height='25' rx='5' fill='%2300ff88'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', monospace;
            overflow-x: hidden;
        }

        /* Анимированный фон с частицами */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 50%, #0a0e27 0%, #000000 100%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header с неоновым эффектом */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: linear-gradient(135deg, #00ff8833, #00d4ff33);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px #00ff88; }
            50% { box-shadow: 0 0 20px #00ff88; }
        }

        /* 3D Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #0f1233 0%, #0a0e27 100%);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.2);
        }

        .stat-value {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-top: 10px;
        }

        /* Таблица сигналов */
        .signals-section {
            background: rgba(15, 18, 51, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            margin-bottom: 30px;
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-filter {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        input, select {
            background: #0a0e27;
            border: 1px solid #00ff8833;
            color: #00ff88;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .filter-btn {
            background: #00ff8822;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #00ff88;
            color: #000;
        }

        .signals-container {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0a0e27;
            padding: 15px 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ff88;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: #00d4ff;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.2s;
        }

        tr {
            cursor: pointer;
            transition: all 0.2s;
        }

        tr:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(1.01);
        }

        .buy {
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 5px #00ff88;
        }

        .sell {
            color: #ff4444;
            font-weight: bold;
            text-shadow: 0 0 5px #ff4444;
        }

        /* Кнопка обновления */
        .refresh-btn {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            color: #000;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        /* Анимация для новых сигналов */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .signal-row {
            animation: slideIn 0.3s ease;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 12px;
        }

        /* Скроллбар */
        .signals-container::-webkit-scrollbar {
            width: 6px;
        }

        .signals-container::-webkit-scrollbar-track {
            background: #0a0e27;
            border-radius: 10px;
        }

        .signals-container::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header { flex-direction: column; text-align: center; }
            h1 { font-size: 24px; }
            .stat-value { font-size: 32px; }
            th, td { font-size: 11px; padding: 8px; }
        }
    </style>
</head>
<body>

<div id="particles"></div>

<div class="container">
    <div class="header">
        <h1>
            <span>🤖</span> AI TRADE MACHINE <span style="font-size: 14px;">PRO</span>
        </h1>
        <div style="display: flex; gap: 15px;">
            <div class="badge">⚡ LIVE TRADING</div>
            <div class="badge" id="lastUpdate">🟢 Обновлено: сейчас</div>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalSignals">0</div>
            <div class="stat-label">ВСЕГО СИГНАЛОВ</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="buySignals">0</div>
            <div class="stat-label">BUY (LONG)</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="sellSignals">0</div>
            <div class="stat-label">SELL (SHORT)</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="winRate">—</div>
            <div class="stat-label">ТОЧНОСТЬ</div>
        </div>
    </div>

    <div class="signals-section">
        <div class="signals-header">
            <h2 style="font-size: 20px;">📊 ТОРГОВЫЕ СИГНАЛЫ</h2>
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="🔍 Поиск монеты..." onkeyup="filterSignals()">
                <select id="typeFilter" onchange="filterSignals()">
                    <option value="all">📌 Все сигналы</option>
                    <option value="buy">🟢 Только BUY</option>
                    <option value="sell">🔴 Только SELL</option>
                </select>
                <button class="refresh-btn" onclick="loadSignals()">🔄 ОБНОВИТЬ</button>
            </div>
        </div>
        <div class="signals-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortBy('time')">⏰ Время</th>
                        <th onclick="sortBy('symbol')">💰 Актив</th>
                        <th onclick="sortBy('action')">📈 Сигнал</th>
                        <th onclick="sortBy('price')">💵 Цена</th>
                        <th onclick="sortBy('rsi')">📊 RSI</th>
                        <th>📝 Причина</th>
                    </tr>
                </thead>
                <tbody id="signalsBody">
                    <tr><td colspan="6" style="text-align: center; padding: 50px;">🔄 Загрузка сигналов...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        AI Trade Machine PRO | Автономная торговая система | ⚡ Клик по строке → график Bybit
    </div>
</div>

<script>
    let allSignals = [];
    let currentSort = { column: 'time', direction: 'desc' };

    // Функция открытия графика Bybit (100% рабочая)
    function openBybitChart(symbol) {
        if (!symbol) return;
        let cleanSymbol = symbol.replace('/USDT', '').replace('USDT', '');
        let url = `https://www.bybit.com/trade/spot/${cleanSymbol}/USDT?interval=60`;
        window.open(url, '_blank');
    }

    // Загрузка сигналов
    async function loadSignals() {
        try {
            const response = await fetch('/api/signals');
            allSignals = await response.json();
            
            // Обновляем время
            document.getElementById('lastUpdate').innerHTML = `🟢 Обновлено: ${new Date().toLocaleTimeString()}`;
            
            // Обновляем статистику
            const buys = allSignals.filter(s => s.action === 'buy').length;
            const sells = allSignals.filter(s => s.action === 'sell').length;
            document.getElementById('totalSignals').innerText = allSignals.length;
            document.getElementById('buySignals').innerText = buys;
            document.getElementById('sellSignals').innerText = sells;
            
            // Эмулируем точность (пока заглушка, потом добавим реальную)
            document.getElementById('winRate').innerText = allSignals.length > 0 ? '75%' : '—';
            
            // Применяем фильтры и сортировку
            filterAndRender();
            
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('signalsBody').innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 50px;">❌ Ошибка подключения к серверу</td></tr>';
        }
    }

    // Фильтрация сигналов
    function filterSignals() {
        filterAndRender();
    }

    function filterAndRender() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const typeFilter = document.getElementById('typeFilter').value;
        
        let filtered = allSignals.filter(signal => {
            const matchesSearch = signal.symbol.toLowerCase().includes(searchTerm);
            const matchesType = typeFilter === 'all' || signal.action === typeFilter;
            return matchesSearch && matchesType;
        });
        
        // Сортировка
        filtered.sort((a, b) => {
            let valA, valB;
            switch(currentSort.column) {
                case 'time':
                    valA = new Date(a.timestamp);
                    valB = new Date(b.timestamp);
                    break;
                case 'symbol':
                    valA = a.symbol;
                    valB = b.symbol;
                    break;
                case 'action':
                    valA = a.action;
                    valB = b.action;
                    break;
                case 'price':
                    valA = parseFloat(a.price) || 0;
                    valB = parseFloat(b.price) || 0;
                    break;
                case 'rsi':
                    valA = parseFloat(a.rsi) || 0;
                    valB = parseFloat(b.rsi) || 0;
                    break;
                default:
                    return 0;
            }
            
            if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
            return 0;
        });
        
        renderSignals(filtered);
    }

    function renderSignals(signals) {
        const tbody = document.getElementById('signalsBody');
        
        if (signals.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 50px;">📭 Нет сигналов по выбранным фильтрам</td></tr>';
            return;
        }
        
        let html = '';
        for (let i = 0; i < signals.length; i++) {
            const s = signals[i];
            const actionClass = s.action === 'buy' ? 'buy' : 'sell';
            const actionText = s.action === 'buy' ? '🟢 BUY' : '🔴 SELL';
            const time = new Date(s.timestamp).toLocaleString('ru-RU');
            const price = s.price ? `$${Number(s.price).toLocaleString()}` : '—';
            const rsi = s.rsi !== '-' ? s.rsi : '—';
            const reason = s.reason ? (s.reason.length > 60 ? s.reason.slice(0, 60) + '...' : s.reason) : '—';
            
            html += `
                <tr class="signal-row" onclick="openBybitChart('${s.symbol}')">
                    <td style="font-size: 12px;">${time}</td>
                    <td><b>${s.symbol}</b></td>
                    <td class="${actionClass}">${actionText}</td>
                    <td>${price}</td>
                    <td>${rsi}</td>
                    <td style="font-size: 11px; max-width: 250px;">${reason}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }

    function sortBy(column) {
        if (currentSort.column === column) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.column = column;
            currentSort.direction = 'desc';
        }
        filterAndRender();
    }

    // Анимированные частицы
    function createParticles() {
        const particles = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.width = '2px';
            particle.style.height = '2px';
            particle.style.background = '#00ff88';
            particle.style.borderRadius = '50%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animation = `float ${5 + Math.random() * 10}s linear infinite`;
            particle.style.opacity = Math.random() * 0.5;
            particles.appendChild(particle);
        }
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes float {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100vh); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
    
    // Запуск
    createParticles();
    loadSignals();
    setInterval(loadSignals, 15000);
</script>

</body>
</html>
