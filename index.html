<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trade Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00ff88;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #141a33;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a3457;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .table-container {
            background: #141a33;
            border-radius: 12px;
            overflow: auto;
            max-height: 600px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #1a2340;
            padding: 15px 12px;
            text-align: left;
            font-size: 12px;
            color: #aaa;
            position: sticky;
            top: 0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #2a3457;
        }
        
        tr {
            cursor: pointer;
            transition: background 0.2s;
        }
        
        tr:hover {
            background: #1f2a4a;
        }
        
        .buy {
            color: #00ff88;
            font-weight: bold;
        }
        
        .sell {
            color: #ff4444;
            font-weight: bold;
        }
        
        .refresh-btn {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .refresh-btn:hover {
            background: #00cc6a;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #555;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Trade Machine</h1>
        <div class="subtitle">Автономная торговая система | Клик по строке → график Bybit</div>
        
        <button class="refresh-btn" onclick="location.reload()">🔄 Обновить сигналы</button>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalSignals">0</div>
                <div class="stat-label">ВСЕГО СИГНАЛОВ</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="buySignals">0</div>
                <div class="stat-label">BUY</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sellSignals">0</div>
                <div class="stat-label">SELL</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="accuracy">—</div>
                <div class="stat-label">ТОЧНОСТЬ</div>
            </div>
        </div>
        
        <div class="table-container">
            <table id="signalsTable">
                <thead>
                    <tr>
                        <th>Актив</th>
                        <th>Таймфрейм</th>
                        <th>Сигнал</th>
                        <th>Цена</th>
                        <th>RSI</th>
                        <th>Время</th>
                    </tr>
                </thead>
                <tbody id="signalsBody">
                    <tr>
                        <td colspan="6" class="loading">Загрузка сигналов...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            🟢 Система активна | Сигналы обновляются каждые 15 секунд
        </div>
    </div>
    
    <script>
        // Функция открытия графика Bybit (работает 100%)
        function openBybitChart(symbol) {
            if (!symbol) {
                console.warn('Нет символа');
                return;
            }
            
            // Очищаем символ: BTC/USDT -> BTCUSDT
            let cleanSymbol = symbol.replace('/', '').replace('USDT', '');
            let url = 'https://www.bybit.com/trade/spot/' + cleanSymbol + '/USDT?interval=60';
            
            console.log('Открываем график:', url);
            window.open(url, '_blank');
        }
        
        // Загрузка сигналов с сервера
        async function loadSignals() {
            try {
                const response = await fetch('/api/signals');
                const signals = await response.json();
                
                const tbody = document.getElementById('signalsBody');
                
                if (!signals || signals.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="loading">📡 Нет сигналов. Ожидание первого сигнала от парсера...</td></tr>';
                    document.getElementById('totalSignals').innerText = '0';
                    document.getElementById('buySignals').innerText = '0';
                    document.getElementById('sellSignals').innerText = '0';
                    return;
                }
                
                let buyCount = 0;
                let sellCount = 0;
                let html = '';
                
                for (let i = 0; i < signals.length; i++) {
                    const s = signals[i];
                    
                    if (s.action === 'buy' || s.direction === 'BUY') buyCount++;
                    if (s.action === 'sell' || s.direction === 'SELL') sellCount++;
                    
                    const action = (s.action || s.direction || '').toUpperCase();
                    const actionClass = action === 'BUY' ? 'buy' : 'sell';
                    const symbol = s.symbol || '?';
                    const timeframe = s.timeframe || '1h';
                    const price = s.price ? '$' + Number(s.price).toLocaleString() : '—';
                    const rsi = s.rsi || '—';
                    const timestamp = s.timestamp ? new Date(s.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
                    
                    // Ключевой момент: onclick прямо в строке
                    html += `<tr onclick="openBybitChart('${symbol}')" style="cursor: pointer;">`;
                    html += `<td><b>${symbol}</b></td>`;
                    html += `<td>${timeframe}</td>`;
                    html += `<td class="${actionClass}">${action}</td>`;
                    html += `<td>${price}</td>`;
                    html += `<td>${rsi}</td>`;
                    html += `<td>${timestamp}</td>`;
                    html += `</tr>`;
                }
                
                tbody.innerHTML = html;
                document.getElementById('totalSignals').innerText = signals.length;
                document.getElementById('buySignals').innerText = buyCount;
                document.getElementById('sellSignals').innerText = sellCount;
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('signalsBody').innerHTML = '<tr><td colspan="6" class="loading">❌ Ошибка подключения к серверу</td></tr>';
            }
        }
        
        // Загружаем сразу
        loadSignals();
        
        // И каждые 15 секунд
        setInterval(loadSignals, 15000);
        
        // Проверяем что функция доступна глобально
        window.openBybitChart = openBybitChart;
        console.log('✅ Скрипт загружен, функция openBybitChart доступна');
    </script>
</body>
</html>
